# Memory for the Gradle daemon that builds the app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Use the AndroidX libraries (the modern replacement for the old support library).
android.useAndroidX=true
# Each module's R class only contains its own resources (faster builds).
android.nonTransitiveRClass=true
kotlin.code.style=official
